spring:
  application:
    name: e-invest-lab

  threads:
    virtual:
      enabled: true

  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/einvestlab?useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true

  # db/migration 의 V{n}__{설명}.sql 을 시작 시 자동 적용
  flyway:
    enabled: true
    locations: classpath:db/migration

dart:
  api:
    base-url: https://opendart.fss.or.kr/api
    key: ${DART_API_KEY:}

hankyung:
  api:
    base-url: https://consensus.hankyung.com

research:
  pdf-storage:
    root: ./data/analyst-report-pdfs
