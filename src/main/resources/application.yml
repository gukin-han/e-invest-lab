spring:
  application:
    name: e-invest-lab

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:mysql://localhost:3306/einvestlab?useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true

  # db/migration 의 V{n}__{설명}.sql 을 시작 시 자동 적용
  flyway:
    enabled: true
    locations: classpath:db/migration

  # OpenAI api-key 는 application-local.properties 에서 주입
  ai:
    openai:
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3
      api-key: ${OPENAI_API_KEY:}

dart:
  api:
    base-url: https://opendart.fss.or.kr/api
    key: ${DART_API_KEY:}
  polling:
    interval: 60000

kis:
  api:
    base-url: https://openapivts.koreainvestment.com:29443
    appkey: ${KIS_APP_KEY:}
    appsecret: ${KIS_APP_SECRET:}
  polling:
    interval: 300000
