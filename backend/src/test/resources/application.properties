spring.application.name=e-invest-lab

# Virtual Threads
spring.threads.virtual.enabled=true

# JPA — Testcontainers가 @ServiceConnection으로 datasource 자동 주입.
# Flyway 가 db/migration 의 .sql 로 스키마를 만들고, Hibernate 는 매핑 일치만 검증.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway — main yml 의 설정이 test 에서 상속되지 않을 가능성 대비 명시
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
