name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Test
        run: ./gradlew test --no-daemon

  deploy:
    needs: test
    runs-on: [self-hosted, einvestlab]
    steps:
      - uses: actions/checkout@v4

      - name: Sync to deploy directory
        run: |
          mkdir -p ~/e-invest-lab/data
          rsync -a --delete --exclude='.git' --exclude='data' --exclude='.env' ./ ~/e-invest-lab/

      - name: Write .env
        run: |
          cat > ~/e-invest-lab/.env <<'ENVEOF'
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DART_API_KEY=${{ secrets.DART_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          STOCK_PRICE_API_KEY=${{ secrets.STOCK_PRICE_API_KEY }}
          SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}
          ENVEOF
          echo "APP_TAG=${GITHUB_SHA::7}" >> ~/e-invest-lab/.env

      - name: Build and start
        run: |
          cd ~/e-invest-lab
          docker compose --profile app up -d --build

      - name: Health check
        run: |
          cd ~/e-invest-lab
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/stocks/recently-covered > /dev/null; then
              echo "app is up"; docker compose ps; exit 0
            fi
            sleep 5
          done
          echo "app did not become healthy"; docker compose logs --tail 100 app; exit 1

      - name: Prune old images
        run: docker image prune -f > /dev/null
