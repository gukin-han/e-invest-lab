services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: einvestlab
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: e-invest-lab:${APP_TAG:-local}
    restart: unless-stopped
    profiles: ["app"]
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Seoul
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      DART_API_KEY: ${DART_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      STOCK_PRICE_API_KEY: ${STOCK_PRICE_API_KEY}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/einvestlab?useSSL=false&allowPublicKeyRetrieval=true
    volumes:
      - ./data/analyst-report-pdfs:/app/data/analyst-report-pdfs
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
